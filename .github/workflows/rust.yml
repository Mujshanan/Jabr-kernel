name: Rust

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test, lint and docs (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit rustfmt changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(kernel): apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test default features
        run: cargo test --all-targets
      - name: Test serde feature
        run: cargo test --all-targets --features serde
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0
      - name: Check all features on MSRV
        run: cargo check --all-targets --all-features
