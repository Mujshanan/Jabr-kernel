[package]
name = "jabr-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Domain-neutral shared infrastructure for Jabr"
license = "MIT"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
