[package]
name = "jabr-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Domain-neutral shared infrastructure for Jabr"
license = "MIT"

[features]
default = []
serde = ["jabr-kernel-api/serde"]

[dependencies]
jabr-kernel-api = { path = "crates/jabr-kernel-api", version = "0.1.0", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
